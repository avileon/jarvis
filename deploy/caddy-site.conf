# JARVIS — appended to the host Caddyfile (DNS record must be "DNS only" so Let's Encrypt can issue).
jarvis.vibit.co.il {
	encode zstd gzip
	header Strict-Transport-Security "max-age=31536000; includeSubDomains"
	reverse_proxy 127.0.0.1:3100
	log {
		output file /var/log/caddy/jarvis.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}
